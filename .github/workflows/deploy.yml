name: Build & Deploy Lingue-Fluente

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      # 1. PRENDI IL CODICE
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. SETUP PYTHON
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. 📦 SET PYTHONPATH (FIX IMPORT AUTOMATION)
      - name: Set PYTHONPATH
        run: |
          echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

      # 4. INSTALL DIPENDENZE
      - name: Install dependencies
        run: |
          pip install requests pyyaml python-frontmatter

      # 5. 🧠 AUTOPILOT (GENERA ARTICOLI)
      - name: Run Autopilot
        run: |
          python automation/autopilot/autopilot_runner.py

      # 6. 🏗️ COSTRUISCI IL SITO
      - name: Build site
        run: |
          python scripts/build_site.py

      # 7. DEBUG (VEDI SE FILE ESISTONO)
      - name: Debug output
        run: |
          echo "=== ROOT ==="
          ls -R
          echo "=== POSTS ==="
          ls -R _posts || echo "_posts non trovato"
          echo "=== SITE ==="
          ls -R _site || echo "_site non trovato"

      # 8. 🌍 DEPLOY SU GITHUB PAGES
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
