pipeline:

  generation:

    enabled: true

    provider: "gemini"

    model: "gemini-2.5-pro"

    temperature: 0.7

    max_tokens: 4000

  article_defaults:

    language: "it"

    target_language: "en"

    author: "Lingue-Fluente AI"

    layout: "post"

    publish: true

    indexed: true

  seo_defaults:

    schema_type: "Article"

    faq_enabled: true

    table_enabled: true

    auto_meta_description: true

    auto_semantic_keywords: true

    auto_slug: true

    auto_title_optimization: true

  automation:

    auto_internal_links: true

    auto_related_posts: true

    auto_cta: true

    auto_schema: true

    auto_toc: true

    auto_faq_generation: true

    auto_social_snippets: true

    auto_pinterest_assets: true

  article_rules:

    min_word_count: 1200

    ideal_word_count: 1800

    max_word_count: 3000

    min_headings: 5

    min_internal_links: 3

    min_cta_blocks: 2

  content_quality:

    readability: "easy"

    paragraphs_max_lines: 4

    avoid_ai_patterns: true

    avoid_keyword_stuffing: true

    humanize_output: true

  publishing:

    auto_save_draft: true

    auto_build_site: true

    auto_deploy: false

  pinterest:

    enabled: true

    generate_titles: true

    generate_descriptions: true

    generate_overlay_text: true

    generate_image_prompts: true

    title_variants: 5

  tracking:

    track_generation: true

    track_cta_clicks: true

    track_internal_links: true

    track_scroll_depth: true
